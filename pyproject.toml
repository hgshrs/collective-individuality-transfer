[project]
name = "collective-id"
version = "0.1.0"
description = "Collective-ID: individuality transfer in collective resource tracking (Chirkov et al. 2026 data)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7",
  "numpy>=2.0",
  "pandas>=2.2",
  "xarray>=2024.6",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "networkx>=3.3",
  "mesa==2.2.4",
  "icecream>=2.1",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "osfclient>=0.0.5",
  "pyarrow>=16",
  "polars>=1.0",
  "netcdf4>=1.7",
  "tabulate>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collective_id"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
